<style>

.sp .cur button{background:var(--brand);color:var(--on)}.sp .dn button{background:color-mix(in srgb,var(--brand) 18%,transparent);color:var(--text)}.sp button:disabled{cursor:not-allowed}

</style></head><body><div id="root"></div>
<script>
/* ===== Camada de dados =====
 Hoje: localStorage do navegador (apenas demonstração). Para produção, troque só as funções de `api`
 por supabase.from(tabela) e use Supabase Auth no lugar de entrar()/criarConta().
 Tabelas: empresas, usuarios, profissionais, servicos, clientes, agendamentos, horarios.
 Toda linha (exceto empresas) tem empresa_id. RLS sugerida para o painel:
   using (empresa_id = (select empresa_id from usuarios where id = auth.uid()))
 A página pública (#reservar-slug) deve ler empresa/serviços/profissionais por slug e criar
 agendamentos via RPC, sem expor dados de clientes. WhatsApp: ligar em hooks.agendamentoCriado. */
const K='finathe_agenda_v1';
let DB;try{DB=JSON.parse(localStorage.getItem(K))}catch(e){}
DB=DB||{empresas:[],usuarios:[],profissionais:[],servicos:[],clientes:[],agendamentos:[],horarios:[]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}};
const hooks={agendamentoCriado:row=>{}};
const uid=()=>Math.random().toString(36).slice(2,10);
const S={user:null,eid:null,off:0,sel:null,q:'',open:null,oc:null,fs:'todos',fp:'todos',metric:'rec'};
const api={
 list:(t,eid=S.eid)=>DB[t].filter(r=>r.empresa_id===eid),
 get:(t,id)=>DB[t].find(r=>r.id===id),
 insert:(t,row,eid=S.eid)=>{const r={id:uid(),empresa_id:eid,...row};DB[t].push(r);save();if(t==='agendamentos')hooks.agendamentoCriado(r);return r},
 update:(t,id,p)=>{const r=Object.assign(api.get(t,id),p);save();return r},
 remove:(t,id)=>{DB[t]=DB[t].filter(r=>r.id!==id);save()}
};
const $=id=>document.getElementById(id),R=$('root'),co=()=>api.get('empresas',S.eid);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slugify=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'negocio';
const hash=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
const pad=n=>String(n).padStart(2,'0'),dg=s=>String(s||'').replace(/\D/g,'');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mins=h=>+h.slice(0,2)*60+ +h.slice(3),hm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const on=c=>{const n=parseInt(c.slice(1),16);return((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000>150?'#081B35':'#fff'};

function freeIds(eid,date,m,svc,pid){
 const ids=!pid||pid==='any'?api.list('profissionais',eid).map(p=>p.id):[pid];
 const ap=api.list('agendamentos',eid).filter(a=>a.data===date&&a.status!=='cancelado');
 return ids.filter(id=>!ap.some(a=>{const s=mins(a.hora),x=api.get('servicos',a.servico_id);return a.profissional_id===id&&m<s+(x?x.dur:30)&&s<m+svc.dur}));
}
function slots(eid,date,svc,pid){
 const h=api.list('horarios',eid).find(x=>x.dia===new Date(date+'T12:00').getDay());
 if(!h||!h.ativo)return[];
 const now=new Date(),out=[];
 for(let m=mins(h.ini);m+svc.dur<=mins(h.fim);m+=30){
  if(date===iso(now)&&m<=now.getHours()*60+now.getMinutes())continue;
  if(freeIds(eid,date,m,svc,pid).length)out.push(hm(m));
 }
 return out;
}
function client(eid,nome,tel){return api.list('clientes',eid).find(c=>dg(c.tel)&&dg(c.tel)===dg(tel))||api.insert('clientes',{nome,tel,email:''},eid)}

function upLogo(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,220/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);T.logo=c.toDataURL('image/png');pv()};im.src=r.result};r.readAsDataURL(f);
